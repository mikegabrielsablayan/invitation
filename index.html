<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💌 An Invitation For You</title>

  <!-- Google Fonts: Pacifico for the romantic script headings, Poppins for clean body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== AMBIENT BACKGROUND LAYERS ===================== -->

  <!-- Soft blurred blobs that drift slowly behind everything -->
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <!-- Floating hearts container: hearts are injected here by script.js -->
  <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

  <!-- Sparkles container: little twinkles injected by script.js -->
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <!-- Confetti container, populated only when YES is clicked -->
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <!-- Fireworks canvas layer, only used on the YES celebration -->
  <canvas id="fireworksCanvas" aria-hidden="true"></canvas>

  <!-- Heart cursor trail dots get appended straight to body via JS -->

  <!-- Background music plays automatically the instant the visitor taps
       the envelope (their first interaction with the page) — browsers
       block audio-with-sound before that, so this is the earliest point
       it's legally allowed to start. No mute button, per request: once
       it starts, it keeps playing and looping.
       Track: NIKI - Take A Chance With Me — https://www.youtube.com/watch?v=iygXgP2nOF4 -->
  <div id="ytPlayer" style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none;"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <audio id="popSound" preload="none">
    <source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_c6ccf3d54c.mp3?filename=pop-39222.mp3" type="audio/mpeg" />
  </audio>

  <!-- ===================== MAIN STAGE ===================== -->
  <main class="stage">

    <!-- ---------- SCREEN 1: Landing / Envelope ---------- -->
    <section id="landingScreen" class="screen landing-screen">
      <p class="eyebrow">💌 Open Invitation 💌</p>

      <button id="envelopeBtn" class="envelope-btn" aria-label="Open your invitation">
        <span class="envelope" id="envelope">
          <span class="envelope-back"></span>
          <span class="envelope-flap"></span>
          <span class="envelope-letter">
            <span class="letter-heart">💗</span>
          </span>
          <span class="envelope-front-left"></span>
          <span class="envelope-front-right"></span>
          <span class="envelope-seal">💕</span>
        </span>
      </button>

      <p class="hint">tap the envelope&hellip;</p>
    </section>

    <!-- ---------- SCREEN 2: The Question ---------- -->
    <section id="questionScreen" class="screen question-screen hidden">
      <div class="card" id="questionCard">
        <div class="card-sparkle">✨</div>
        <h1 class="question-text" id="questionText"><!-- typewriter fills this in --></h1>

        <div class="button-row" id="buttonRow">
          <button id="yesBtn" class="btn btn-yes">❤️ YES</button>
          <button id="noBtn" class="btn btn-no">🙈 NO</button>
        </div>

        <p class="teasing-msg" id="teasingMsg">&nbsp;</p>
      </div>
    </section>

    <!-- ---------- SCREEN 3: Plan the date (type + calendar) ---------- -->
    <section id="planScreen" class="screen plan-screen hidden">
      <div class="card plan-card">
        <div class="card-sparkle">✨</div>
        <h2 class="plan-title">One more thing&hellip; 💭</h2>
        <p class="plan-subtitle">What kind of date, and when?</p>

        <!-- Date-type picker -->
        <div class="date-type-grid" id="dateTypeGrid">
          <button type="button" class="date-type-btn" data-type="Coffee Date ☕">
            <span class="date-type-emoji">☕</span>
            <span class="date-type-label">Coffee Date</span>
          </button>
          <button type="button" class="date-type-btn" data-type="Fast Food 🍔">
            <span class="date-type-emoji">🍔</span>
            <span class="date-type-label">Fast Food</span>
          </button>
          <button type="button" class="date-type-btn" data-type="Samgyupsal 🥩">
            <span class="date-type-emoji">🥩</span>
            <span class="date-type-label">Samgyupsal</span>
          </button>
        </div>

        <!-- Mini calendar -->
        <div class="calendar" id="calendar">
          <div class="calendar-header">
            <button type="button" id="prevMonthBtn" class="cal-nav-btn" aria-label="Previous month">&#10094;</button>
            <span class="calendar-month-label" id="calendarMonthLabel"></span>
            <button type="button" id="nextMonthBtn" class="cal-nav-btn" aria-label="Next month">&#10095;</button>
          </div>
          <div class="calendar-weekdays">
            <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <p class="plan-selection" id="planSelectionSummary">&nbsp;</p>

        <button type="button" id="confirmPlanBtn" class="btn btn-yes" disabled>Confirm Our Date 💌</button>
      </div>
    </section>

    <!-- ---------- SCREEN 4: Celebration ---------- -->
    <section id="celebrationScreen" class="screen celebration-screen hidden">
      <div class="happy-face" id="happyFace">😊❤️</div>
      <h1 class="yay-text">YAY!! 🎉</h1>
      <p class="yay-sub">YES na ha! ❤️</p>
      <p class="yay-sub2" id="yaySub2">Can't wait for our date! 🌹</p>

      <a
        id="sendMessageBtn"
        class="btn btn-message"
        href="https://www.instagram.com/ghaab88/"
        target="_blank"
        rel="noopener noreferrer"
      >
        💖 Send Me a Message
      </a>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
