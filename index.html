<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💌 An Invitation For You</title>

  <!-- Google Fonts: Pacifico for the romantic script headings, Poppins for clean body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== AMBIENT BACKGROUND LAYERS ===================== -->

  <!-- Soft blurred blobs that drift slowly behind everything -->
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <!-- Floating hearts container: hearts are injected here by script.js -->
  <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

  <!-- Sparkles container: little twinkles injected by script.js -->
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <!-- Confetti container, populated only when YES is clicked -->
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <!-- Fireworks canvas layer, only used on the YES celebration -->
  <canvas id="fireworksCanvas" aria-hidden="true"></canvas>

  <!-- Heart cursor trail dots get appended straight to body via JS -->

  <!-- ===================== MUSIC TOGGLE ===================== -->
  <button id="musicToggle" class="music-toggle" aria-label="Toggle background music" title="Toggle romantic tune">
    🔇
  </button>
  <!-- Bonus: placeholder romantic tune. Swap the src for any royalty-free track you like. -->
  <audio id="bgMusic" loop preload="none">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lovely-piano-115377.mp3" type="audio/mpeg" />
  </audio>
  <audio id="popSound" preload="none">
    <source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_c6ccf3d54c.mp3?filename=pop-39222.mp3" type="audio/mpeg" />
  </audio>

  <!-- ===================== MAIN STAGE ===================== -->
  <main class="stage">

    <!-- ---------- SCREEN 1: Landing / Envelope ---------- -->
    <section id="landingScreen" class="screen landing-screen">
      <p class="eyebrow">💌 Open Invitation 💌</p>

      <button id="envelopeBtn" class="envelope-btn" aria-label="Open your invitation">
        <span class="envelope" id="envelope">
          <span class="envelope-back"></span>
          <span class="envelope-flap"></span>
          <span class="envelope-letter">
            <span class="letter-heart">💗</span>
          </span>
          <span class="envelope-front-left"></span>
          <span class="envelope-front-right"></span>
          <span class="envelope-seal">💕</span>
        </span>
      </button>

      <p class="hint">tap the envelope&hellip;</p>
    </section>

    <!-- ---------- SCREEN 2: The Question ---------- -->
    <section id="questionScreen" class="screen question-screen hidden">
      <div class="card" id="questionCard">
        <div class="card-sparkle">✨</div>
        <h1 class="question-text" id="questionText"><!-- typewriter fills this in --></h1>

        <div class="button-row" id="buttonRow">
          <button id="yesBtn" class="btn btn-yes">❤️ YES</button>
          <button id="noBtn" class="btn btn-no">🙈 NO</button>
        </div>

        <p class="teasing-msg" id="teasingMsg">&nbsp;</p>
      </div>
    </section>

    <!-- ---------- SCREEN 3: Celebration ---------- -->
    <section id="celebrationScreen" class="screen celebration-screen hidden">
      <div class="happy-face" id="happyFace">😊❤️</div>
      <h1 class="yay-text">YAY!! 🎉</h1>
      <p class="yay-sub">I knew you'd say YES! ❤️</p>
      <p class="yay-sub2">Can't wait for our date! 🌹</p>

      <!-- Bonus final CTA: replace the href with your real contact link (sms:, https://instagram.com/..., etc.) -->
      <a
        id="sendMessageBtn"
        class="btn btn-message"
        href="https://www.instagram.com/ghaab88/"
        target="_blank"
        rel="noopener noreferrer"
      >
        💖 Send Me a Message
      </a>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
